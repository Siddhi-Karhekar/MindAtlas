# Render Blueprint - deploys Mind Atlas as ONE web service: the Express API
# also serves the built React client, so the whole app is on a single URL.
# In Render: New + -> Blueprint -> pick this repo. You'll be asked for the
# two values marked `sync: false` below.
services:
  - type: web
    name: mindatlas
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: JWT_SECRET
        generateValue: true   # Render creates a strong random secret
      - key: MONGODB_URI
        sync: false           # paste your MongoDB Atlas connection string
      - key: GROQ_API_KEY
        sync: false           # optional - leave blank for rule-based fallback
