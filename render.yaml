# Render Blueprint for Mind Atlas - describes exactly what is live today:
# TWO services that auto-deploy from `main`, plus MongoDB Atlas (not on Render).
#
#   mindatlas      Static Site  - the React client  https://mindatlas.onrender.com
#   mindatlas-api  Web Service  - the Express API   https://mindatlas-api.onrender.com
#
# The live services were created by hand from the dashboard; this file is the
# written record of their settings, and lets anyone rebuild them from scratch
# (New + -> Blueprint -> this repo). DEPLOY.md explains every setting.
#
# Before applying it to a workspace that already runs these services, read
# DEPLOY.md "Rebuilding from this Blueprint": JWT_SECRET is regenerated (which
# signs everyone out) and the two `sync: false` values are asked for again.

services:
  # --- API -----------------------------------------------------------------
  - type: web
    name: mindatlas-api
    runtime: node
    plan: free
    region: singapore          # closest Render region to the Atlas cluster (AWS Mumbai)
    rootDir: server
    # The optional MiniLM model (server/semantic/) links notes across subjects
    # by meaning. It costs ~130 MB of the free plan's 512 MB (API idles at
    # ~260 MB with it). If the service runs out of memory, set
    # SEMANTIC_MODEL=off in Environment: links fall back to TF-IDF.
    buildCommand: npm ci && npm run semantic:install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production      # also makes the server refuse to start without MONGODB_URI
      - key: TRUST_PROXY
        value: "1"
      - key: CORS_ORIGIN
        value: https://mindatlas.onrender.com   # the static site below - no trailing slash
      - key: JWT_SECRET
        generateValue: true    # Render creates a strong random secret
      - key: MONGODB_URI
        sync: false            # MongoDB Atlas connection string - spelled exactly MONGODB_URI
      - key: GROQ_API_KEY
        sync: false            # optional - AI questions and marking; blank = rule-based fallback
      - key: SUPPORT_EMAIL
        sync: false            # help address shown to students
      - key: ADMIN_USER_IDS
        sync: false            # account ids (comma-separated) that may open /admin
      # Email confirmation and "Forgot password?" stay off until the SMTP_*
      # settings, MAIL_FROM and APP_URL are added - see DEPLOY.md "Email".

  # --- Client --------------------------------------------------------------
  - type: web
    name: mindatlas
    runtime: static
    rootDir: client
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeploy: true
    envVars:
      - key: VITE_API_BASE     # baked in at build time - redeploy the site if the API URL changes
        value: https://mindatlas-api.onrender.com/api
    headers:
      # A static host only sends the headers it is told to (the API sends its
      # own). Render already adds Strict-Transport-Security and nosniff.
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
    routes:
      # React Router handles pages like /subjects/:id in the browser; without
      # this, refreshing any page but the home page is a 404.
      # (Not yet done on the live site: an /api/* rewrite to the API placed
      # above this rule, with VITE_API_BASE=/api - docs/SECURITY.md.)
      - type: rewrite
        source: /*
        destination: /index.html
